spring:
  application:
    name: weaver-agent
  profiles:
    active: local
  main:
    banner-mode: off
    log-startup-info: false
    web-application-type: none

# Weaver Agent Configuration
weaver:
  cli:
    enabled: true
  max-agent-steps: 15
  semantic-min-score: 0.92
  cache-max-results: 1
  workspace-root: ${user.dir}

  # ChromaDB (semantic cache)
  chroma:
    url: http://localhost:8000
    collection: weaver-experience

  # AI Provider Configuration (add your API keys here or in configs/application-local.yml)
  providers:
    groq:
      api-key: ${GROQ_API_KEY:}
      enabled: true
    gemini:
      api-key: ${GEMINI_API_KEY:}
      enabled: true
    cerebras:
      api-key: ${CEREBRAS_API_KEY:}
      enabled: true
    mistral:
      api-key: ${MISTRAL_API_KEY:}
      enabled: true
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      enabled: true

# Logging - all logs go to ~/.weaver/logs/weaver.log (see logback-spring.xml)
# Terminal stays clean for CLI UX
logging:
  level:
    root: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
